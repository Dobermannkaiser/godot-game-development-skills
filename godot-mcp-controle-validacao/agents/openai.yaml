interface:
  display_name: godot mcp controle validacao
  short_description: Controlar o uso de Godot MCP e Codex em projetos Godot 4.x com
    autorização obrigatória antes de qualquer alteração, inspeção prévia, validação
    independente de writes, prevenção de falsos sucessos, reprodução antes de corrigir
    bugs, regressões, auditoria de escopo e diretrizes empiricamente derivadas de
    um benchmark de 27 testes no Golem’s Mandate. Usar sempre que uma IA operar Godot
    via MCP, editar projeto com Codex ou combinar acesso direto aos arquivos com execução/debug
    no motor.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
